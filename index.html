<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prajwal Weds Sree Lakshmi</title>
<meta name="description" content="Our families joyfully invite you to celebrate one of the most special days of our lives. Your presence will make our happiness complete">
<meta property="og:type" content="website">
<meta property="og:title" content="Prajwal Weds Sree Lakshmi">
<meta property="og:description" content="Our families joyfully invite you to celebrate one of the most special days of our lives. Your presence will make our happiness complete">
<meta property="og:image" content="https://prajwal-sreelakshmi.in/groom/preview.jpg">
<meta property="og:url" content="https://prajwal-sreelakshmi.in/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--maroon:#721d32;--deep:#4a1020;--gold:#d6b260;--cream:#fcf3e0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;color:var(--cream);text-align:center;
  font-family:'Cormorant Garamond',Georgia,serif;background:linear-gradient(180deg,var(--maroon),var(--deep))}
.card{width:min(100%,420px);padding:40px 26px 34px;border:1px solid var(--gold);outline:1px solid #a07846;outline-offset:6px;border-radius:6px}
.om{font-family:'Noto Sans Devanagari','Kohinoor Devanagari','Devanagari Sangam MN','Nirmala UI',serif;font-size:44px;color:var(--gold);line-height:1.1}
.eyebrow{margin:14px 0 4px;font:700 11px/1 Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
h1{margin:6px 0 4px;font:400 clamp(44px,13vw,60px)/1.15 'Great Vibes',cursive}
.sub{margin:0 0 26px;font-size:20px;opacity:.9}
a.btn{display:block;margin:12px 0;padding:15px 18px;border:1px solid var(--gold);color:var(--cream);text-decoration:none;
  font:700 12px/1.2 Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;border-radius:3px;transition:background .2s,color .2s}
a.btn:hover,a.btn:focus{background:var(--gold);color:var(--deep)}
a.btn.main{background:var(--gold);color:var(--deep)}
a.btn.main:hover{background:#e6c57a}
.date{margin-top:24px;font-size:19px;color:var(--gold)}
</style>
</head>
<body>
  <main class="card">
    <div class="om" aria-label="Om">ॐ</div>
    <div class="eyebrow">Wedding Invitation</div>
    <h1>Prajwal &amp; Sree Lakshmi</h1>
    <p class="sub">Please choose your invitation</p>
    <a class="btn main" href="groom/">Groom&rsquo;s side invitation</a>
    <a class="btn" href="bride/">Bride&rsquo;s side invitation</a>
    <div class="date">Thursday, 26 November 2026 &middot; Adoni</div>
  </main>
</body>
</html>
